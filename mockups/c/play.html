<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>案C プレイ — eスポーツ HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --lime:#c8ff3d; --blue:#3db8ff; --done:#6b7364; --bg:#07090c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Sans JP", sans-serif; color: #eef3ea;
      background: radial-gradient(900px 500px at 100% 0%, rgba(61,184,255,.08), transparent 45%), #07090c;
      overflow: hidden;
    }
    .hud { position: relative; height: 100%; }
    .timer {
      position: absolute; top: 22px; left: 26px;
      font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 44px; letter-spacing: .04em;
      color: var(--lime); text-shadow: 0 0 14px rgba(200,255,61,.35);
    }
    .timer.warn { color: #ff4d5a; animation: pop .35s ease; text-shadow: 0 0 16px rgba(255,77,90,.7); }
    .right-top { position: absolute; top: 20px; right: 26px; text-align: right; }
    .end {
      font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .16em;
      color: var(--blue); background: transparent; border: 1px solid var(--blue); padding: 7px 12px; cursor: pointer;
    }
    .end:hover { background: rgba(61,184,255,.12); }
    .score-wrap { margin-top: 10px; position: relative; }
    .score-label { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .22em; color: #7f8a76; }
    .score { font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 36px; }
    .delta { position: absolute; right: 0; top: 100%; font-family: "Exo 2", sans-serif; font-weight: 700; font-size: 18px; opacity: 0; }
    .delta.plus {
      background: linear-gradient(90deg,#ff4d6d,#ffd166,#4ade80,#38bdf8,#c084fc);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: fadeDelta 1s ease forwards;
    }
    .delta.minus { color: #ff4d5a; animation: fadeDelta 1s ease forwards; }
    .stage { position: absolute; left: 50%; top: 15%; transform: translateX(-50%); width: min(920px, 92vw); text-align: center; }
    .source {
      display: inline-block; margin-bottom: 14px; padding: 3px 10px;
      font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .18em;
      color: var(--blue); border: 1px solid rgba(61,184,255,.45);
    }
    .jp { font-size: clamp(26px, 3.3vw, 36px); font-weight: 700; line-height: 1.7; }
    .roma { margin-top: 14px; font-family: "JetBrains Mono", monospace; font-size: clamp(16px, 2.2vw, 22px); line-height: 1.75; }
    .ch { color: #fff; }
    .ch.done { color: var(--done); }
    .ch.cur { color: var(--lime); text-shadow: 0 0 10px rgba(200,255,61,.8); border-bottom: 2px solid var(--lime); animation: blink 1s steps(1) infinite; }
    .kb-wrap { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); width: min(980px, 96vw); }
    .kb {
      display: grid; gap: 6px; padding: 16px;
      background: rgba(10,14,12,.78); border: 1px solid rgba(200,255,61,.22);
      box-shadow: inset 0 0 0 1px rgba(61,184,255,.08);
    }
    .kb-row { display: flex; justify-content: center; gap: 6px; }
    .key {
      min-width: 42px; height: 42px; padding: 0 8px; display: flex; align-items: center; justify-content: center;
      border: 1px solid #222a20; background: #0c100d;
      font-family: "JetBrains Mono", monospace; font-size: 13px; color: #c5d0b8;
    }
    .key.wide { min-width: 72px; }
    .key.space { min-width: 280px; }
    .key.lit { background: var(--lime); color: #071008; border-color: var(--lime); box-shadow: 0 0 16px rgba(200,255,61,.55); }
    .combo { position: absolute; right: 32px; bottom: 18%; transform: rotate(-6deg); text-align: center; pointer-events: none; }
    .perfect {
      font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 22px;
      background: linear-gradient(90deg,#ff4d6d,#ffd166,#4ade80,#38bdf8,#c084fc,#ff4d6d);
      background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: rainbow 1s linear, fadeDelta 1s ease forwards; margin-bottom: 4px;
    }
    .combo-num {
      font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 96px; line-height: .85; color: #fff6c8;
      filter: drop-shadow(0 0 10px #ff8a1a) drop-shadow(0 0 22px #c8ff3d);
      position: relative;
    }
    .combo-num.hot { font-size: 112px; filter: drop-shadow(0 0 14px #ff9a1f) drop-shadow(0 0 30px #ff3b00); }
    .combo-num.grow { animation: grow .28s ease; }
    .combo-num::before {
      content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
      width: 80px; height: 46px; background: radial-gradient(circle at 50% 80%, #ffb347, #c8ff3d 40%, transparent 70%);
      filter: blur(8px);
    }
    .combo-label { margin-top: 10px; font-family: "Exo 2", sans-serif; letter-spacing: .42em; color: #d7e8a8; }
    .tools { position: absolute; left: 22px; bottom: 18px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 3; }
    .tools a, .tools button {
      font-family: "JetBrains Mono", monospace; font-size: 11px; color: #93a089;
      background: rgba(7,9,12,.7); border: 1px solid #2a3328; padding: 7px 9px; cursor: pointer; text-decoration: none;
    }
    .miss { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(90,0,12,.55); align-items: center; justify-content: center; }
    .miss.show { display: flex; }
    .ring-wrap { position: relative; width: 220px; height: 220px; }
    .ring-wrap svg { transform: rotate(-90deg); }
    .count {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-family: "Exo 2", sans-serif; font-weight: 800; font-size: 96px;
      text-shadow: 0 0 16px #fff, 0 0 28px var(--lime);
    }
    @keyframes blink { 50% { opacity: .28; } }
    @keyframes fadeDelta { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes pop { 40% { transform: scale(1.18); } }
    @keyframes grow { 40% { transform: scale(1.22); } }
    @keyframes rainbow { to { background-position: 200% 0; } }
  </style>
</head>
<body>
  <div class="hud">
    <div class="timer" id="timer">2:47</div>
    <div class="right-top">
      <button class="end" id="endBtn">END</button>
      <div class="score-wrap">
        <div class="score-label">SCORE</div>
        <div class="score" id="score">12,430</div>
        <div class="delta" id="delta"></div>
      </div>
    </div>
    <div class="stage">
      <div class="source">日常会話より</div>
      <div class="jp" id="jp"></div>
      <div class="roma" id="roma"></div>
    </div>
    <div class="combo">
      <div class="perfect" id="perfect" hidden>Perfect!</div>
      <div class="combo-num" id="comboNum">3</div>
      <div class="combo-label" id="comboLabel">コンボ</div>
    </div>
    <div class="kb-wrap"><div class="kb" id="kb"></div></div>
    <div class="tools">
      <a href="./start.html">スタートへ</a>
      <a href="../index.html">比較一覧</a>
      <button type="button" id="missBtn">ミス演出</button>
      <button type="button" id="perfectBtn">Perfect演出</button>
      <button type="button" id="warnBtn">残り10秒</button>
    </div>
  </div>
  <div class="miss" id="miss">
    <div class="ring-wrap">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="96" stroke="rgba(255,255,255,.16)" stroke-width="10" fill="none" />
        <circle id="arc" cx="110" cy="110" r="96" stroke="#c8ff3d" stroke-width="10" fill="none" stroke-dasharray="603" stroke-linecap="round" />
      </svg>
      <div class="count" id="count">3</div>
    </div>
  </div>
  <script>
    const jpText = "週末は友達と新しいカフェに行って、ゆっくり話をしようと思います。";
    const romaText = "shuumatsu wa tomodachi to atarashii kafe ni itte, yukkuri hanashi o shiyou to omoimasu.";
    const jpEl = document.getElementById("jp");
    const romaEl = document.getElementById("roma");
    const kbEl = document.getElementById("kb");
    const scoreEl = document.getElementById("score");
    const deltaEl = document.getElementById("delta");
    const timerEl = document.getElementById("timer");
    const comboNum = document.getElementById("comboNum");
    const perfectEl = document.getElementById("perfect");
    let jpIndex = 8, romaIndex = 22, score = 12430, combo = 3, remain = 167;
    function paint(el, text, idx) {
      el.innerHTML = [...text].map((ch, i) => {
        const cls = i < idx ? "done" : i === idx ? "cur" : "";
        return `<span class="ch ${cls}">${ch === " " ? "&nbsp;" : ch}</span>`;
      }).join("");
    }
    function renderText() { paint(jpEl, jpText, jpIndex); paint(romaEl, romaText, romaIndex); }
    const rows = [["`","1","2","3","4","5","6","7","8","9","0","-","="],["Q","W","E","R","T","Y","U","I","O","P","[","]"],["A","S","D","F","G","H","J","K","L",";","'"],["Z","X","C","V","B","N","M",",",".","/"]];
    kbEl.innerHTML = rows.map((r, i) => {
      const extras = i === 1 ? `<div class="key wide">TAB</div>` : i === 2 ? `<div class="key wide">CAPS</div>` : i === 3 ? `<div class="key wide">SHIFT</div>` : "";
      return `<div class="kb-row">${extras}${r.map((k) => `<div class="key" data-k="${k.toLowerCase()}">${k}</div>`).join("")}</div>`;
    }).join("") + `<div class="kb-row"><div class="key space" data-k=" ">SPACE</div></div>`;
    function light(ch) {
      document.querySelectorAll(".key.lit").forEach((k) => k.classList.remove("lit"));
      const key = [...document.querySelectorAll(".key")].find((k) => k.dataset.k === ch.toLowerCase());
      if (key) { key.classList.add("lit"); setTimeout(() => key.classList.remove("lit"), 160); }
    }
    function showDelta(n) {
      deltaEl.className = "delta";
      deltaEl.textContent = (n >= 0 ? "+" : "") + n + "pt";
      void deltaEl.offsetWidth;
      deltaEl.classList.add(n >= 0 ? "plus" : "minus");
    }
    function setScore(n) { score = Math.max(0, n); scoreEl.textContent = score.toLocaleString(); }
    function setCombo(n) {
      combo = n;
      const on = combo > 0;
      comboNum.style.display = on ? "" : "none";
      document.getElementById("comboLabel").style.display = on ? "" : "none";
      if (!on) return;
      comboNum.textContent = combo;
      comboNum.classList.toggle("hot", combo >= 5);
    }
    function tickDemo() {
      if (romaIndex >= romaText.length) {
        romaIndex = 0; jpIndex = 0; setCombo(combo + 1);
        comboNum.classList.remove("grow"); void comboNum.offsetWidth; comboNum.classList.add("grow");
        const bonus = Math.round(1000 * Math.min(1 + combo * 0.1, 1.5));
        setScore(score + bonus); showDelta(bonus); return;
      }
      light(romaText[romaIndex]);
      romaIndex += 1;
      if (romaIndex % 3 === 0 && jpIndex < jpText.length) jpIndex += 1;
      const gain = Math.round(100 * Math.min(1 + combo * 0.1, 1.5));
      setScore(score + gain); showDelta(gain); renderText();
    }
    renderText();
    setCombo(3);
    setInterval(tickDemo, 420);
    setInterval(() => {
      if (document.getElementById("miss").classList.contains("show")) return;
      remain = Math.max(0, remain - 1);
      timerEl.textContent = `${Math.floor(remain / 60)}:${String(remain % 60).padStart(2, "0")}`;
      if (remain <= 10) { timerEl.classList.remove("warn"); void timerEl.offsetWidth; timerEl.classList.add("warn"); }
    }, 1000);
    document.getElementById("missBtn").onclick = () => {
      const miss = document.getElementById("miss"); const arc = document.getElementById("arc"); const count = document.getElementById("count");
      miss.classList.add("show"); setCombo(0);
      setScore(score - 500); showDelta(-500);
      let left = 3; count.textContent = left; const started = performance.now();
      function frame(now) {
        const t = Math.min(1, (now - started) / 3000);
        arc.style.strokeDashoffset = String(603 * t);
        const next = 3 - Math.floor(t * 3);
        if (next !== left && next > 0) { left = next; count.textContent = left; }
        if (t < 1) requestAnimationFrame(frame);
        else { miss.classList.remove("show"); arc.style.strokeDashoffset = "0"; romaIndex = 0; jpIndex = 0; renderText(); }
      }
      requestAnimationFrame(frame);
    };
    document.getElementById("perfectBtn").onclick = () => {
      perfectEl.hidden = false;
      const bonus = Math.round(1000 * Math.min(1 + (combo + 1) * 0.1, 1.5));
      setCombo(combo + 1);
      comboNum.classList.remove("grow"); void comboNum.offsetWidth; comboNum.classList.add("grow");
      setScore(score + bonus); showDelta(bonus);
      setTimeout(() => { perfectEl.hidden = true; }, 1000);
    };
    document.getElementById("warnBtn").onclick = () => { remain = 10; };
    document.getElementById("endBtn").onclick = () => {
      if (confirm("プレイを終了しますか？（モックのためスタートへ戻ります）")) location.href = "./start.html";
    };
    window.addEventListener("keydown", (e) => { if (e.key.length === 1) light(e.key); });
  </script>
</body>
</html>
